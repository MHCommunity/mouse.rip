name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # One version everywhere, so a new Bun release can't change what the lockfile installs unannounced.
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check code quality
        run: bun run check

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Any value: the build signs its social card links with it, and the server the tests run against checks them.
      OG_CARD_SECRET: for-the-browser-tests-only

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # One version everywhere, so a new Bun release can't change what the lockfile installs unannounced.
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build the site
        run: bun run build
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Run the browser and accessibility tests
        run: bun run test:e2e
      - name: Keep the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
