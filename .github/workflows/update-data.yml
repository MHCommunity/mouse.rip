name: Update Data

on:
  schedule:
    - cron: '0 12 * * 4' # Thursdays at noon UTC, after api.mouse.rip regenerates at midnight
  workflow_dispatch:

concurrency:
  group: mousebot-main-writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          # Keep the token out of .git/config while dependencies install; only
          # the push step below gets it.
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Update data
        run: bun run update:data

      - name: Commit changes
        run: |
          git config --local user.name "Mousebot"
          git config --local user.email "mousebot@mouse.rip"
          git add src/data/generated
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update data"
      - name: Push changes
        run: git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
